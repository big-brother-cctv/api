name: CI - Backend API

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches-ignore: [ "main" ]

jobs:
  test-and-build:
    name: Lint, Test & Go Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache: true

      - name: Verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Run unit tests
        run: go test -v -race -coverprofile=coverage.txt ./...

      - name: Build binary
        run: go build -v -ldflags="-s -w" -o /tmp/server ./cmd/server

  docker-dry-run:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (Validation only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ghcr.io/${{ github.repository }}:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max